events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Hide Nginx version for security
    server_tokens off;

    upstream minimarket_backend {
        server minimarket-app:8080;
    }

    server {
        # API Gateway listening port inside the container
        listen 80;
        server_name _;

        # Maximum payload size for product images
        client_max_body_size 20M;

        # Standard HTTP security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://minimarket_backend;
            proxy_http_version 1.1;

            # Forward original client headers to Spring Boot
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

