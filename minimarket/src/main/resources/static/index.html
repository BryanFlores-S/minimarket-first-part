<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket App</title>
    <!-- Tailwind CSS CDN for Utility-First Responsive Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Search & Close Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- Sticky Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center gap-2 cursor-pointer" id="brandLogo">
                <i class="fa-solid font-bold text-emerald-600 text-2xl fa-store"></i>
                <span class="text-xl font-extrabold tracking-tight text-gray-900 hidden sm:inline">Minimarket</span>
            </div>

            <!-- Instant Search Bar (Pinterest Style) -->
            <div class="flex-1 max-w-2xl relative">
                <div class="relative flex items-center w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        data-i18n-placeholder="searchPlaceholder"
                        placeholder="Search products..." 
                        class="w-full pl-11 pr-10 py-2.5 bg-gray-100 hover:bg-gray-200/80 focus:bg-white focus:ring-2 focus:ring-emerald-500 rounded-full text-sm font-medium transition-all duration-200 outline-none border border-transparent focus:border-emerald-500"
                    >
                    <button id="clearSearchBtn" class="hidden absolute right-3 text-gray-400 hover:text-gray-600 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Language Switcher -->
            <div class="flex items-center gap-2">
                <select id="langSelect" class="bg-gray-100 hover:bg-gray-200 text-xs font-semibold text-gray-700 py-2 px-3 rounded-lg border-none outline-none cursor-pointer">
                    <option value="es">🇪🇨 ES</option>
                    <option value="en">🇺🇸 EN</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6">
            <h1 id="catalogTitle" data-i18n="catalogTitle" class="text-2xl font-bold tracking-tight text-gray-900">
                Popular Products
            </h1>
        </div>

        <!-- Product Grid (Responsive Container) -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Dynamic Product Cards will be rendered here via Vanilla JS -->
        </div>

        <!-- Loading Spinner for Infinite Scroll -->
        <div id="loadingSpinner" class="flex justify-center items-center py-10 hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-5xl text-gray-300 mb-4"></i>
            <p id="emptyStateMsg" data-i18n="noProducts" class="text-gray-500 font-medium">No products found.</p>
        </div>
    </main>

    <!-- Product Detail Modal (Responsive Dialog) -->
    <div id="productModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl transform transition-all duration-300 scale-95 opacity-0 relative" id="modalContent">
            
            <!-- Close Button -->
            <button id="closeModalBtn" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 w-9 h-9 rounded-full flex items-center justify-center transition-colors z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Modal Content Layout -->
            <div class="p-6">
                <!-- Image Container -->
                <div class="w-full h-64 bg-gray-100 rounded-xl overflow-hidden mb-6 flex items-center justify-center">
                    <img id="modalImg" src="" alt="" class="w-full h-full object-contain p-4">
                </div>

                <!-- Product Attributes -->
                <span id="modalCategory" class="text-xs font-semibold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">Minimarket</span>
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-900 mt-2"></h2>
                <p id="modalPrice" class="text-3xl font-extrabold text-emerald-600 mt-2"></p>
                
                <hr class="my-4 border-gray-100">
                
                <h3 data-i18n="descriptionLabel" class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">Description</h3>
                <p id="modalDescription" class="text-gray-600 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="js/app.js"></script>
</body>
</html>
