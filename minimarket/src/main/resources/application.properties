
# name
spring.application.name=minimarket

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/minimarket_db
spring.datasource.username=postgres
spring.datasource.password=admin12345
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Application Port
server.port=8080

# Forwarded headers strategy for API Gateway / Reverse Proxy support
server.forward-headers-strategy=framework