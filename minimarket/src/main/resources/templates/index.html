<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center gap-2 cursor-pointer" id="brandLogo">
                <i class="fa-solid font-bold text-emerald-600 text-2xl fa-store"></i>
                <span class="text-xl font-extrabold tracking-tight text-gray-900 hidden sm:inline">Minimarket</span>
            </div>

            <!-- Real-time Search Input -->
            <div class="flex-1 max-w-2xl relative">
                <div class="relative flex items-center w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Buscar productos..." 
                        class="w-full pl-11 pr-10 py-2.5 bg-gray-100 hover:bg-gray-200/80 focus:bg-white focus:ring-2 focus:ring-emerald-500 rounded-full text-sm font-medium transition-all duration-200 outline-none border border-transparent focus:border-emerald-500"
                    >
                    <button id="clearSearchBtn" class="hidden absolute right-3 text-gray-400 hover:text-gray-600 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Actions Header Button (No Language Selector) -->
            <div class="flex items-center gap-2">
                <button id="openCrudModalBtn" onclick="openCrudModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 sm:px-4 rounded-lg shadow-sm flex items-center gap-1.5 transition-all cursor-pointer">
                    <i class="fa-solid fa-gear"></i>
                    <span>Administrar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Productos Populares</h1>
        </div>

        <!-- Products Grid Rendered by Thymeleaf -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <div th:each="product : ${products}" 
                 class="product-card bg-white rounded-2xl p-4 border border-gray-100 cursor-pointer flex flex-col justify-between shadow-sm"
                 th:attr="data-name=${product.name}, data-price=${product.price}, data-image=${product.imageUrl}, data-description=${product.description}"
                 onclick="openProductModalFromCard(this)">
                
                <div class="w-full bg-gray-50 rounded-xl overflow-hidden mb-3 p-2 flex items-center justify-center">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : '/data_minimarket/placeholder.jpg'}" 
                         th:alt="${product.name}" 
                         class="w-full h-36 object-contain" 
                         onError="this.onerror=null;this.src='https://via.placeholder.com/150?text=No+Image';">
                </div>
                
                <div class="flex flex-col flex-grow">
                    <h3 class="font-bold text-gray-900 text-sm line-clamp-1" th:text="${product.name}">Nombre Producto</h3>
                    <p class="text-xs text-gray-500 mt-1 mb-2 leading-relaxed line-clamp-2" th:text="${product.description}">Descripción</p>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-gray-50 mt-auto">
                    <div>
                        <span class="text-[10px] uppercase font-semibold text-gray-400 block">PRECIO:</span>
                        <span class="text-base font-extrabold text-emerald-600" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</span>
                    </div>
                    <button class="w-8 h-8 rounded-full bg-emerald-50 hover:bg-emerald-600 text-emerald-600 hover:text-white flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-5xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 font-medium">No se encontraron productos.</p>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="productModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl transform transition-all duration-300 scale-95 opacity-0 relative" id="modalContent">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 w-9 h-9 rounded-full flex items-center justify-center transition-colors z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="p-6">
                <div class="w-full h-64 bg-gray-100 rounded-xl overflow-hidden mb-6 flex items-center justify-center">
                    <img id="modalImg" src="" alt="" class="w-full h-full object-contain p-4">
                </div>
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">Minimarket</span>
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-900 mt-2"></h2>
                <p id="modalPrice" class="text-3xl font-extrabold text-emerald-600 mt-2"></p>
                <hr class="my-4 border-gray-100">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">Descripción</h3>
                <p id="modalDescription" class="text-gray-600 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- CRUD Management Modal Window (Spring MVC Traditional Form Actions) -->
    <div id="crudModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative transform transition-all duration-300 scale-95 opacity-0" id="crudModalContent">
            <button onclick="closeCrudModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 w-9 h-9 rounded-full flex items-center justify-center transition-colors z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <h2 class="text-xl font-bold text-gray-900 mb-4 border-b pb-2">Administrar Productos (Spring MVC)</h2>

            <!-- Spring MVC Form with th:action and th:object -->
            <form id="productForm" th:action="@{/products/save}" th:object="${productForm}" method="post" class="bg-gray-50 p-4 rounded-xl mb-6 border border-gray-200 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="hidden" id="productId" th:field="*{id}">
                
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Nombre del Producto</label>
                    <input type="text" id="formName" th:field="*{name}" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Precio ($)</label>
                    <input type="number" step="0.01" id="formPrice" th:field="*{price}" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Ruta de la Imagen</label>
                    <input type="text" id="formImage" th:field="*{imageUrl}" placeholder="/data_minimarket/leche.jpg" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Descripción</label>
                    <input type="text" id="formDescription" th:field="*{description}" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="sm:col-span-2 flex justify-end gap-2 mt-2">
                    <button type="button" onclick="resetCrudForm()" class="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg hover:bg-gray-300">Cancelar / Limpiar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700">Guardar Producto</button>
                </div>
            </form>

            <!-- Table with Products Rendered by Thymeleaf -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-600">
                    <thead class="bg-gray-100 text-gray-800 uppercase text-[10px] font-bold">
                        <tr>
                            <th class="p-2">ID</th>
                            <th class="p-2">Nombre</th>
                            <th class="p-2">Precio</th>
                            <th class="p-2">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="p : ${products}" class="hover:bg-gray-50 border-b">
                            <td class="p-2 font-mono" th:text="${p.id}">1</td>
                            <td class="p-2 font-bold" th:text="${p.name}">Nombre</td>
                            <td class="p-2" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</td>
                            <td class="p-2 flex gap-2">
                                <button type="button" 
                                        class="bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200 text-[10px] font-bold"
                                        th:attr="onclick=|populateEditForm('${p.id}', '${p.name}', '${p.price}', '${p.imageUrl}', '${p.description}')|">
                                    Editar
                                </button>
                                <a th:href="@{/products/delete/{id}(id=${p.id})}" 
                                   onclick="return confirm('¿Deseas eliminar este producto?')"
                                   class="bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200 text-[10px] font-bold inline-block">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
